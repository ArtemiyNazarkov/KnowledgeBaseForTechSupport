{% extends 'upperbase.html' %}
{% block content %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/addedit.css') }}">

<form action="{{ url_for('edit_application', id=application.id) }}" method="post" enctype="multipart/form-data">
    {{ form.hidden_tag() }}
    <div class="form-floating">
        {{ form.naimenovanie_prilozheniya(class="form-control", id="floatingInput") }}
      <label for="floatingInput">{{ form.naimenovanie_prilozheniya.label() }}</label>
    </div>

    {{ form.submit(class="w-100 btn btn-lg btn-primary", type="submit") }}
</form>
{% endblock %}
